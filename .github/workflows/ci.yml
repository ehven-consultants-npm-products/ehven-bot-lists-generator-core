name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['24.19.0', '24.22.3']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install locked development tools without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify behavior, types and packed installation
        run: npm run check
      - name: Review dependency advisories
        run: npm audit --audit-level=high

  required:
    name: Required checks
    if: always()
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - name: Require every matrix job to pass
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: test "$VERIFY_RESULT" = success
